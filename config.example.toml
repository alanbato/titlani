[server]
host = "0.0.0.0"
port = 1958
hostname = "example.com"
mailbox_dir = "mailboxes"
# certfile = "server.pem"
# keyfile = "server.key"
# identity_certfile = "identity.pem"
# identity_keyfile = "identity.key"

[rate_limit]
enable = false
capacity = 10.0
refill_rate = 1.0
retry_after = 30

[access_control]
enable = false
allow_list = []
deny_list = []
default_allow = true

[encryption]
# Enable at-rest encryption for stored messages.
# Each mailbox needs an X25519 keypair: <mailbox>.enc.key / <mailbox>.enc.pub
# Generate with: titlani identity generate <mailbox> <hostname> --with-encryption-key
# The server loads only public keys (.enc.pub) for encryption.
# Private keys (.enc.key) stay user-owned for CLI decryption.
# Mailboxes without key files store messages as plaintext.
enable = false
# key_dir = "keys"  # Directory containing .enc.pub files (default: mailbox_dir)
