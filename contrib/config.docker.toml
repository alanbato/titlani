# Titlani server configuration for Docker deployment
# Mount your TLS certificates into /etc/titlani/certs/

[server]
host = "0.0.0.0"
port = 1958
hostname = "mail.example.com"
mailbox_dir = "/var/lib/titlani/mailboxes"
certfile = "/etc/titlani/certs/server.pem"
keyfile = "/etc/titlani/certs/server.key"
identity_certfile = "/etc/titlani/certs/identity.pem"
identity_keyfile = "/etc/titlani/certs/identity.key"

[rate_limit]
enable = true
capacity = 10.0
refill_rate = 1.0
retry_after = 30

[access_control]
enable = false
allow_list = []
deny_list = []
default_allow = true

[proxy_protocol]
# Enable when running behind a TCP relay (Traefik, HAProxy, nginx stream)
# that sends a PROXY protocol header, so rate limiting, access control and
# logs see real client IPs. Applies to both the Misfin and GMAP listeners.
# trusted_sources lists the relay's own IPs/CIDRs; only they may send headers.
enable = false
trusted_sources = []
# header_timeout = 5.0

[verification]
mode = "optional"
cache_path = "/var/lib/titlani/verification_cache.db"
probe_timeout = 10.0

[encryption]
enable = false
# key_dir = "/etc/titlani/keys"
