[project]
name = "titlani"
version = "0.1.0"
description = "Misfin(C) mail protocol client and server library"
readme = "README.md"
authors = [
    { name = "Alan Velasco", email = "alanvelasco.a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.4",
    "rich>=14.3.2",
    "ruff>=0.15.0",
    "structlog>=25.5.0",
    "tlacacoca>=0.1.4",
    "typer>=0.21.1",
]

[project.scripts]
titlani = "titlani.__main__:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.151.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.11.12",
    "ty>=0.0.15",
]

[tool.ruff]
target-version = "py313"
line-length = 90

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/titlani/__main__.py" = ["B008", "C901"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]
